name: Daily cybernews briefing

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    # Backup slots only refresh if the day's deployment has not been saved.
    - cron: '7,37 8 * * *'
      timezone: Europe/Bucharest
    - cron: '23 9 * * *'
      timezone: Europe/Bucharest
    - cron: '41 11 * * *'
      timezone: Europe/Bucharest
    - cron: '53 15 * * *'
      timezone: Europe/Bucharest

permissions: {}

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out the site
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Refresh the daily briefing
        if: github.event_name == 'schedule'
        run: python scripts/update-cybernews.py --scheduled

      - name: Refresh when the briefing is due during a site update
        if: github.event_name == 'push'
        continue-on-error: true
        run: python scripts/update-cybernews.py --scheduled

      - name: Refresh a manually requested briefing
        if: github.event_name == 'workflow_dispatch'
        run: python scripts/update-cybernews.py

      - name: Check whether a deployment is needed
        id: site
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" != schedule ]] || ! git diff --quiet -- data/cybernews.json; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate the briefing snapshot
        if: steps.site.outputs.deploy == 'true'
        run: python scripts/update-cybernews.py --validate

      - name: Configure GitHub Pages
        if: steps.site.outputs.deploy == 'true'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Assemble the static site
        if: steps.site.outputs.deploy == 'true'
        shell: bash
        run: |
          mkdir _site
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='scripts/' \
            --exclude='_site/' \
            ./ _site/

      - name: Upload the Pages artifact
        if: steps.site.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        if: steps.site.outputs.deploy == 'true'
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

      - name: Record the published briefing
        if: steps.site.outputs.deploy == 'true'
        shell: bash
        run: |
          git add -- data/cybernews.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore(cybernews): refresh daily briefing"
            git push origin HEAD:main
          fi
